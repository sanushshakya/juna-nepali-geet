name: Load test

# Manual only: run it from the Actions tab (or `gh workflow run loadtest.yml`).
# The load comes from GitHub's runner, not your own network, so results are cleaner and use no mobile data.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Site to test (only *.netlify.app is allowed)"
        required: true
        default: "https://imaginative-faun.netlify.app"
      levels:
        description: "Concurrent users per stage, comma separated (each 1-200)"
        required: true
        default: "10,25,50"
      duration:
        description: "Seconds per stage (1-60)"
        required: true
        default: "15"
      spike:
        description: "Users arriving at the same instant (0 = skip, max 300)"
        required: true
        default: "100"
      max_p95_ms:
        description: "Fail if the p95 full page load is slower than this (the spike gets double)"
        required: true
        default: "3000"

permissions:
  contents: read

concurrency:
  group: loadtest
  cancel-in-progress: false

jobs:
  loadtest:
    name: loadtest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Run the load test
        # Inputs go through env vars (never interpolated into the script) to avoid shell injection.
        env:
          BASE_URL: ${{ inputs.url }}
          LEVELS: ${{ inputs.levels }}
          DURATION: ${{ inputs.duration }}
          SPIKE: ${{ inputs.spike }}
          MAX_P95_PAGE_MS: ${{ inputs.max_p95_ms }}
        run: node scripts/loadtest.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loadtest-results
          path: loadtest-results.json
          if-no-files-found: ignore
          retention-days: 30
